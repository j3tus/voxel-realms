[package]
name = "vr_worldgen"
version = "0.1.0"
edition = "2021"
description = "Deterministic terrain generation, a bit-for-bit port of shared/worldgen.js genChunk (browser chunk worker + Node server worker)"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
