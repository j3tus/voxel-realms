# Builds the installable apps and checks the Rust/WASM terrain generator.
# Push a tag like v1.0.0 (git tag v1.0.0 && git push --tags) to publish a GitHub Release with stable asset names that the website's
# /site/download.html links to; or run it by hand (Actions -> apps -> Run workflow) to just get the build artifacts.
name: apps
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: read }   # jobs below ask for more only where they need it
concurrency: { group: 'apps-${{ github.ref }}', cancel-in-progress: false }
env: { TAG: '${{ github.ref_name }}', IS_RELEASE: "${{ startsWith(github.ref, 'refs/tags/v') }}" }
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:wasm            # rebuild from source, then prove it is still bit-identical to the JS reference
      - run: npx vitest run
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Voxel Realms $TAG" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
  desktop:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: { contents: write, id-token: write, attestations: write }   # upload release assets + sign build provenance
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }}
        working-directory: apps/desktop
      - name: Collect with stable names
        run: |
          mkdir -p out; B=apps/desktop/src-tauri/target; [ -d "$B/universal-apple-darwin" ] && B="$B/universal-apple-darwin"; B="$B/release/bundle"
          case "${{ matrix.os }}" in
            ubuntu*)  cp "$B"/appimage/*.AppImage out/voxel-realms-linux-x64.AppImage; cp "$B"/deb/*.deb out/voxel-realms-linux-x64.deb ;;
            macos*)   cp "$B"/dmg/*.dmg out/voxel-realms-macos.dmg ;;
            windows*) cp "$B"/nsis/*.exe out/voxel-realms-windows-x64-setup.exe; cp "$B"/msi/*.msi out/voxel-realms-windows-x64.msi ;;
          esac
          for f in out/*; do (cd out && { sha256sum "$(basename "$f")" 2>/dev/null || shasum -a 256 "$(basename "$f")"; } > "$(basename "$f").sha256"); done
          ls -la out
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with: { subject-path: 'out/*' }
      - uses: actions/upload-artifact@v4
        with: { name: 'desktop-${{ matrix.os }}', path: out/* }
      - if: env.IS_RELEASE == 'true'
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: '${{ github.token }}' }
  android:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      # Optional repository secrets for a SIGNED release APK. Without them the APK is a debug build: it is uploaded as a workflow
      # artifact for testing only and is NEVER attached to the public release (debug builds are debuggable and unsigned for production).
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
        working-directory: apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build (signed release if a keystore secret is set, otherwise debug)
        working-directory: apps/mobile/android
        run: |
          mkdir -p ../../../out
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS"
            cp app/build/outputs/apk/release/*.apk ../../../out/voxel-realms-android.apk; echo SIGNED=1 >> "$GITHUB_ENV"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/*.apk ../../../out/voxel-realms-android-debug.apk
            echo "::warning::No Android signing secrets: built a DEBUG apk. It will not be attached to the release."
          fi
      - run: cd out && for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
      - name: Attest build provenance
        if: env.IS_RELEASE == 'true' && env.SIGNED == '1'
        uses: actions/attest-build-provenance@v2
        with: { subject-path: 'out/*.apk' }
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/* }
      - if: env.IS_RELEASE == 'true' && env.SIGNED == '1'
        run: gh release upload "$TAG" out/voxel-realms-android.apk out/voxel-realms-android.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: '${{ github.token }}' }
