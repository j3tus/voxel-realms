# Builds the installable apps and checks the Rust/WASM terrain generator.
# Push a tag like v2.4.0 (git tag v2.4.0 && git push --tags) to publish a GitHub Release with stable asset names that the website's
# /site/download.html links to; or run it by hand (Actions -> apps -> Run workflow) to just get the build artifacts.
name: apps
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
env: { TAG: '${{ github.ref_name }}', IS_RELEASE: "${{ startsWith(github.ref, 'refs/tags/v') }}" }
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:wasm            # rebuild from source, then prove it is still bit-identical to the JS reference
      - run: npx vitest run
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Voxel Realms $TAG" --generate-notes || true
        env: { GH_TOKEN: '${{ github.token }}' }
  desktop:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm install
        working-directory: apps/desktop
      - run: npx tauri build ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }}
        working-directory: apps/desktop
      - name: Collect with stable names
        run: |
          mkdir -p out; B=apps/desktop/src-tauri/target; [ -d "$B/universal-apple-darwin" ] && B="$B/universal-apple-darwin"; B="$B/release/bundle"
          case "${{ matrix.os }}" in
            ubuntu*)  cp "$B"/appimage/*.AppImage out/voxel-realms-linux-x64.AppImage; cp "$B"/deb/*.deb out/voxel-realms-linux-x64.deb ;;
            macos*)   cp "$B"/dmg/*.dmg out/voxel-realms-macos.dmg ;;
            windows*) cp "$B"/nsis/*.exe out/voxel-realms-windows-x64-setup.exe; cp "$B"/msi/*.msi out/voxel-realms-windows-x64.msi ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'desktop-${{ matrix.os }}', path: out/* }
      - if: env.IS_RELEASE == 'true'
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: '${{ github.token }}' }
  android:
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
        working-directory: apps/mobile
      - run: npx cap sync android && ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - run: mkdir -p out && cp apps/mobile/android/app/build/outputs/apk/debug/*.apk out/voxel-realms-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-debug-apk, path: out/voxel-realms-android.apk }
      - if: env.IS_RELEASE == 'true'
        run: gh release upload "$TAG" out/voxel-realms-android.apk --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: '${{ github.token }}' }
