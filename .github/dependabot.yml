# Keeps the release pipeline's actions and the app/server dependencies current via reviewable PRs.
version: 2
updates:
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /apps/desktop, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /apps/mobile, schedule: { interval: weekly } }
  - { package-ecosystem: cargo, directory: /apps/desktop/src-tauri, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /, schedule: { interval: weekly } }
